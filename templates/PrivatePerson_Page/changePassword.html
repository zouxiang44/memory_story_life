{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · 潇湘叙事驿</title>
    <link rel="shortcut icon" href='{% static 'img/website_loge.svg' %}'>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<a class="auth-back" href="{% url 'home' %}"><i class="bi bi-arrow-left"></i> 返回首页</a>

<div class="standalone-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>修改密码</h2>
            <p>保护你的账号安全</p>
        </div>
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="old_password">旧密码</label>
                <input class="form-input" type="password" name="old_password" id="old_password"
                       placeholder="请输入当前密码" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="new_password">新密码</label>
                <input class="form-input" type="password" name="new_password" id="new_password"
                       placeholder="8-10位字符" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="new_password_again">确认新密码</label>
                <input class="form-input" type="password" name="new_password_again" id="new_password_again"
                       placeholder="再次输入新密码" autocomplete="new-password">
                <span class="form-error"></span>
            </div>
            <button type="button" class="btn btn-primary" style="width:100%; margin-top:8px; padding:12px;">确认修改</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    let form = document.getElementsByTagName('form')[0]
    let submit = document.querySelector('button[type="button"]')
    let error_region = document.getElementsByClassName('form-error')[0];

    submit.addEventListener('click', function(){
        let dataform = new FormData(form)
        axios({
            url:'/app01/setpassword/',
            method:'post',
            data:dataform,
        }).then(function(response){
            if(response.data.code === 0){
                window.location.href = response.data.message;
            }else{
                error_region.innerText = response.data.message;
            }
        })
    })

    let inputs = document.getElementsByTagName('input')
    Array.from(inputs).forEach(function(key){
        key.addEventListener('click', function(){ error_region.innerText = ''; })
    })
</script>
</body>
</html>
