{% extends 'PrivatePerson_Page/admin.html' %}

{% block article %}
<div class="admin-section">
    <h3><i class="bi bi-plus-circle"></i> 添加文章</h3>
    <form action="" method="post" style="max-width:640px;">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="title">文章标题</label>
            <input class="form-input" type="text" name="title" id="title" placeholder="输入文章标题" maxlength="20">
        </div>
        <div class="form-group">
            <label class="form-label" for="content">文章内容</label>
            <textarea class="form-input form-textarea" name="content" id="content" placeholder="写下你的故事..." rows="8"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">文章标签</label>
            <div>
                {% for tag_obj in tag_queryset %}
                <label class="form-check">
                    <input type="checkbox" name="tags" value="{{ tag_obj.id }}" style="display:none;">
                    <span>{{ tag_obj.name }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">文章分类</label>
            <div>
                {% for category_obj in category_queryset %}
                <label class="form-check">
                    <input type="radio" name="category" value="{{ category_obj.id }}" style="display:none;">
                    <span>{{ category_obj.name }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">发布文章</button>
    </form>
</div>
{% endblock %}
