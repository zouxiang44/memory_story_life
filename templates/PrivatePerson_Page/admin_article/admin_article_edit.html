{% extends 'PrivatePerson_Page/admin.html' %}

{% block article %}
<div class="admin-section">
    <h3><i class="bi bi-pencil-square"></i> 编辑文章</h3>
    <form action="" method="post" style="max-width:640px;">
        {% csrf_token %}
        <input type="hidden" name="article_id" value="{{ article_obj.id }}">
        <div class="form-group">
            <label class="form-label">文章标题</label>
            <input class="form-input" type="text" name="title" value="{{ article_obj.title }}" maxlength="20">
        </div>
        <div class="form-group">
            <label class="form-label">文章内容</label>
            <textarea class="form-input form-textarea" name="content" rows="8">{{ article_obj.content }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">文章标签</label>
            <div>
                {% for tag_obj in tag_queryset %}
                <label class="form-check">
                    <input type="checkbox" name="tags" value="{{ tag_obj.id }}" style="display:none;"
                           {% if tag_obj in article_obj.tags.all %}checked{% endif %}>
                    <span>{{ tag_obj.name }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">文章分类</label>
            <div>
                {% for category_obj in category_queryset %}
                <label class="form-check">
                    <input type="radio" name="category" value="{{ category_obj.id }}" style="display:none;"
                           {% if category_obj == article_obj.categories %}checked{% endif %}>
                    <span>{{ category_obj.name }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>
{% endblock %}
