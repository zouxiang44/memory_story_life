{% extends 'PrivatePerson_Page/admin.html' %}

{% block category %}
<div class="admin-section">
    <h3><i class="bi bi-pencil-square"></i> 编辑标签</h3>
    <form action="" method="post" style="max-width:400px;">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">原标签名</label>
            <input class="form-input" type="text" name="old_tag" value="{{ tag_obj.name }}" readonly>
        </div>
        <div class="form-group">
            <label class="form-label">新标签名</label>
            <input class="form-input" type="text" name="new_tag" value="{{ tag_obj.name }}" maxlength="10">
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>
{% endblock %}
