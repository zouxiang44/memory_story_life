{% extends 'PrivatePerson_Page/admin.html' %}

{% block blog %}
<div class="admin-section">
    <h3><i class="bi bi-globe"></i> 站点设置</h3>
    <form action="" method="post" enctype="multipart/form-data" style="max-width:480px;">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">站点名称</label>
            <input class="form-input" type="text" name="site_name" value="{{ request.user.blog.site_title }}">
        </div>
        <div class="form-group">
            <label class="form-label">站点样式</label>
            <label for="css-file" class="form-file-label">
                <i class="bi bi-upload"></i> 选择CSS文件
            </label>
            <input type="file" name="css_file" id="css-file" style="display:none;" accept=".css">
        </div>
        <button type="submit" class="btn btn-primary">保存设置</button>
    </form>
</div>
{% endblock %}
