{% extends 'PrivatePerson_Page/admin.html' %}

{% block author %}
<div class="admin-section">
    <h3><i class="bi bi-person"></i> 作者信息</h3>
    <form action="" method="post" style="max-width:480px;">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">用户名</label>
            <input class="form-input" type="text" name="username" value="{{ request.user.username }}">
        </div>
        <div class="form-group">
            <label class="form-label">邮箱</label>
            <input class="form-input" type="text" name="email" value="{{ request.user.email }}">
        </div>
        <div class="form-group">
            <label class="form-label">手机号</label>
            <input class="form-input" type="text" name="phone" value="{{ request.user.phone }}">
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>
{% endblock %}
