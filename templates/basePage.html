{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潇湘叙事驿</title>
    <link rel="shortcut icon" href='{% static 'img/website_loge.svg' %}'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block css_file %}{% endblock %}
    <style>
        {% block css %}{% endblock %}
    </style>
</head>
<body>

<nav class="navbar" id="mainNav">
    <a class="nav-brand" href="{% url 'home' %}">
        <i class="bi bi-snow2"></i>潇湘叙事驿
    </a>

    {% if request.user.is_authenticated %}
    <div class="nav-user">
        <div class="nav-avatar-wrap">
            <img src="/media/{{ request.user.avatar }}/" alt="">
        </div>
        <span class="nav-username">{{ request.user.username }}</span>
        <div class="nav-dropdown dropdown">
            <a class="btn dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-gear" style="font-size:0.9rem"></i> 管理
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'app01:SetUsername' %}"><i class="bi bi-pencil-square"></i> 用户名修改</a></li>
                <li><a class="dropdown-item" href="{% url 'app01:SetAvatar' %}"><i class="bi bi-image"></i> 头像修改</a></li>
                <li><a class="dropdown-item" href="{% url 'app01:SetPassword' %}"><i class="bi bi-lock"></i> 密码修改</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="{% url 'app01:Admin' %}"><i class="bi bi-speedometer2"></i> 后台管理</a></li>
                <li><a class="dropdown-item text-danger" href="{% url 'app01:Logout' %}"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
            </ul>
        </div>
    </div>
    {% else %}
    <div class="nav-auth">
        <a class="btn-register" href="{% url 'app01:Register' %}">注册</a>
        <a class="btn-login" href="{% url 'app01:Login' %}">登录</a>
    </div>
    {% endif %}
</nav>

<div class="nav-spacer"></div>

<div class="page-wrap">
{% block content %}{% endblock %}
</div>

{% include 'simple_introduce.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // navbar scroll shadow
    window.addEventListener('scroll', () => {
        document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });
    {% block js %}{% endblock %}
</script>
</body>
</html>
